*{box-sizing:border-box} [hidden]{display:none!important}
:root{color-scheme:light;--ink:#253c35;--quiet:#57675e;--wine:#933e36;--paper:#fff8e8;--line:#c0b695}
body{margin:0;background:#e8e4d4;color:var(--ink);font:16px/1.7 "Instrument Sans","Microsoft YaHei",sans-serif}
main{max-width:820px;margin:auto;padding:6vh 24px 3vh}
header,footer{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}header{padding-bottom:16px;border-bottom:1px solid #7b8573}header strong{font:700 24px Georgia,"SimSun",serif;letter-spacing:.15em}header small,footer{color:var(--quiet);font:13px/1.6 Consolas,"Microsoft YaHei",monospace}
article{background:var(--paper);margin:30px 0 22px;padding:clamp(24px,6vw,60px);border:1px solid #c2b99e;box-shadow:3px 5px 0 #d5d0bc;position:relative;overflow:hidden}
article:before{content:"";display:block;position:absolute;left:0;top:0;right:0;height:6px;background:repeating-linear-gradient(125deg,#963f37 0 13px,transparent 13px 24px,#476455 24px 37px,transparent 37px 48px)}
.post{display:flex;min-height:78px;align-items:flex-start;justify-content:space-between;gap:12px}.to{font:italic 21px Georgia,serif;color:var(--quiet)}
.stamp{transform:rotate(5deg);padding:5px;background:#e7ddbe;border:2px dashed var(--paper);color:#415b47;text-align:center}
.stamp b{display:block;border:1px solid #71816b;padding:2px 9px;font:21px/1.5 Georgia,"SimSun",serif;letter-spacing:.17em}.stamp small{display:block;font:9px/1.4 Georgia,serif;letter-spacing:.14em}
h1,h2{margin:6px 0 12px;font:600 clamp(28px,5.8vw,50px)/1.35 Georgia,"Songti SC","SimSun",serif;letter-spacing:.035em}h2{font-size:clamp(25px,5vw,38px)}
p{margin:12px 0}.sub{color:var(--quiet)}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}

label{display:block;font-size:15px;font-weight:bold;margin:18px 0 4px}input,textarea,select{display:block;max-width:100%;width:100%;padding:8px 10px;background:#fffdf4;border:1px solid var(--line);border-radius:3px}textarea{resize:vertical}
small,.note{font-size:13px;color:var(--quiet)}.rule{border-top:1px dashed var(--line);margin:20px 0}footer{padding:0 2px}.bodytext{white-space:pre-wrap;overflow-wrap:anywhere;font:19px/1.9 Georgia,"Songti SC","SimSun",serif}.signature{margin-top:30px;color:var(--wine);font:italic 18px Georgia,"SimSun",serif}.enter{animation:arrive .32s ease-out}@keyframes arrive{from{opacity:.4;transform:translateY(5px)}}@media(prefers-reduced-motion:reduce){.enter{animation:none}}@media(max-width:520px){main{padding:20px 14px}article{margin:18px 0}.post{min-height:70px}}

.route,.folio,.locator{font:14px/1.8 Consolas,'Microsoft YaHei',monospace;color:#854338;overflow-wrap:anywhere}.folio{margin:0 0 13px;letter-spacing:.12em}.route{border-block:1px dashed #b9b194;padding:12px 0;margin-top:24px}.locator{font-size:18px}
.who{position:relative}.who button{border:0;border-bottom:1px dotted currentColor;border-radius:0;padding:2px;color:#344d40}.tip{display:none;position:absolute;bottom:130%;left:0;width:max-content;max-width:min(76vw,340px);background:#253c35;color:#fff8e8;padding:8px 13px;border-radius:4px;z-index:2}.who:last-child .tip{right:0;left:auto}.who:hover .tip,.who:focus-within .tip,.who.pinned .tip{display:block}
.stamp{border-radius:0;padding:5px;line-height:1.1}.stamp:hover{background:#dfd0ab}.aside{padding:16px 20px;background:#f0e6cd;border-left:3px solid #95634c;white-space:pre-wrap;overflow-wrap:anywhere}

.letter-body{line-height:2.05}
.post .stamp{flex:0 0 auto;white-space:nowrap}

@media(prefers-reduced-motion:no-preference){

}

@media print{.ink,.reply-slip,.enter{animation:none!important}}

   target.pathname=target.pathname.replace(/\/?$/,'/')+id+'.web.html';
   seal.disabled=true;
   var keyBytes=crypto.getRandomValues(new Uint8Array(32)),iv=crypto.getRandomValues(new Uint8Array(12));
   crypto.subtle.importKey('raw',keyBytes,{name:'AES-GCM'},false,['encrypt']).then(function(key){
    return crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,new TextEncoder().encode(JSON.stringify(record)));
   }).then(function(cipher){
    present(record,arrival,target.href+'#k='+encodeBytes(keyBytes),{format:'CY-A256GCM-1',iv:encodeBytes(iv),cipher:encodeBytes(new Uint8Array(cipher))});
   }).catch(function(){seal.disabled=false;error.textContent='未能生成加密信封。请重试，或改选已有取信页。'});
  }else{
   if(link&&link.indexOf('#')===-1)link+='#'+id;

}
function takeCard(record,link){
 var payload=link||('未来邮 '+record.id+'\n'+record.hint+'\n'+record.id+'.html');
 qrcode.stringToBytes=qrcode.stringToBytesFuncs['UTF-8'];
 var qr=qrcode(0,'M');qr.addData(payload);qr.make();
 var canvas=document.createElement('canvas'),size=qr.getModuleCount(),cell=Math.max(6,Math.floor(600/(size+8))),edge=(size+8)*cell;
 canvas.width=840;var ctx=canvas.getContext('2d'),margin=52,lines=[];
 function wrap(value){
  var line='';Array.from(value).forEach(function(c){
   if(ctx.measureText(line+c).width>canvas.width-2*margin){lines.push(line);line=''}line+=c;
  });if(line)lines.push(line);
 }
 ctx.font='23px sans-serif';wrap(record.hint);if(link)wrap(link);
 canvas.height=238+edge+lines.length*36;
 ctx.fillStyle='#fffaf0';ctx.fillRect(0,0,canvas.width,canvas.height);
 ctx.fillStyle='#253c35';ctx.font='bold 36px serif';ctx.fillText('未来邮  /  取信卡',margin,67);
 ctx.font='24px monospace';ctx.fillText(record.id,margin,114);
 var left=Math.floor((canvas.width-edge)/2),top=140;
 ctx.fillStyle='white';ctx.fillRect(left,top,edge,edge);ctx.fillStyle='black';
 for(var r=0;r<size;r++)for(var c=0;c<size;c++)if(qr.isDark(r,c))ctx.fillRect(left+(c+4)*cell,top+(r+4)*cell,cell,cell);
 ctx.fillStyle='#253c35';ctx.font='23px sans-serif';var y=top+edge+46;
 lines.forEach(function(line){ctx.fillText(line,margin,y);y+=36});
 var image=node('img',undefined,'ticket');image.src=canvas.toDataURL('image/png');image.alt='取信卡，编号 '+record.id+'。'+record.hint;
 return image;
}

function portal(){
 var box=page('来，取你的信。','从自己的邮箱或网盘下载互动信封，再在这里选取文件。文件只在这台设备上读取。');
 var expected=location.hash.slice(1);
 if(/^CY-[0-9]{8}-[A-Z0-9]+$/.test(expected))box.appendChild(node('p','搜索取信编号 '+expected,'locator'));
 var input=field(box,'local-file','选择已保存的互动信封',node('input'),'');input.type='file';input.accept='.html,.htm,text/html';
 var status=box.appendChild(node('p','','error'));status.setAttribute('role','status');
 input.onchange=function(){
  if(!input.files.length)return;var reader=new FileReader();
  reader.onerror=function(){status.textContent='文件读取失败，可以下载后直接用浏览器打开。'};
  reader.onload=function(){
   try{
    // Extract inert JSON only. Never insert the selected document into the live page.
    var match=String(reader.result).match(/<script id="letter" type="application\/json">([\s\S]*?)<\/script>/i);
    if(!match)throw Error();var record=JSON.parse(match[1]);
    if(!record||!record.date||typeof record.body!=='string')throw Error();
    if(/^CY-[0-9]{8}-[A-Z0-9]+$/.test(expected)&&record.id!==expected){status.textContent='这封信的编号与取信卡不同，请再核对一次。';return}
    if(!record.cards){status.textContent='这是早期版本的信封。下载后直接用浏览器打开，就能使用原来的拆信方式。';return}
    start(record);
   }catch(err){status.textContent='没有识别到未来邮信封，请选封存时保存的 HTML 文件。'}
  };reader.readAsText(input.files[0],'UTF-8');
 };
}

function encodeBytes(bytes){
 var parts=[];for(var offset=0;offset<bytes.length;offset+=8192){parts.push(String.fromCharCode.apply(null,bytes.subarray(offset,offset+8192)))}
 return btoa(parts.join('')).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function decodeBytes(value){var raw=atob(value.replace(/-/g,'+').replace(/_/g,'/'));var out=new Uint8Array(raw.length);for(var i=0;i<raw.length;i++)out[i]=raw.charCodeAt(i);return out}
function decryptEnvelope(packet){
 function help(){page('这是一封上锁的信。','用取信卡扫码，或打开日历中包含 #k= 的完整链接。也可以在邮箱中搜索卡上的编号，直接读自己的离线备份。')}
 var match=location.hash.match(/^#k=([A-Za-z0-9_-]{43})$/);
 if(!match||!window.crypto||!crypto.subtle||!window.TextDecoder){help();return}
 page('正在展开信封…');
 crypto.subtle.importKey('raw',decodeBytes(match[1]),{name:'AES-GCM'},false,['decrypt']).then(function(key){
  return crypto.subtle.decrypt({name:'AES-GCM',iv:decodeBytes(packet.iv)},key,decodeBytes(packet.cipher));
 }).then(function(plain){start(JSON.parse(new TextDecoder().decode(plain)))}).catch(help);
}

document.getElementById('fallback').hidden=true;
setInterval(refresh,30000);document.addEventListener('visibilitychange',refresh);
